<head>

  <script>

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>ROAM Co. | Coming Soon</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html,
    body {
      background: #000;
      color: #fff;
      font-family: Arial, Helvetica, sans-serif;
    }

    body {
      min-height: 100vh;
    }

    .hero {
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 55px 20px 45px;
    }

    .logo {
      width: min(560px, 82vw);
      height: auto;
      display: block;
      margin-bottom: 28px;
    }

    .coming-soon {
      font-size: clamp(26px, 5vw, 42px);
      font-weight: 700;
      letter-spacing: 10px;
      text-transform: uppercase;
    }

    .products {
      width: min(1100px, 94%);
      margin: 0 auto;
      padding: 10px 0 80px;
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 22px;
    }

    .product {
      width: 100%;
      background: #000;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    .product img {
      width: 100%;
      height: auto;
      display: block;
      object-fit: contain;
    }

    @media (max-width: 700px) {
      .hero {
        padding: 38px 18px 34px;
      }

      .logo {
        width: 86vw;
        margin-bottom: 22px;
      }

      .coming-soon {
        font-size: 28px;
        letter-spacing: 7px;
      }

      .products {
        width: 100%;
        display: block;
        padding: 0 0 55px;
      }

      .product {
        width: 100%;
        margin: 0 0 18px;
        padding: 0 12px;
      }

      .product img {
        width: 100%;
        height: auto;
        max-height: none;
        object-fit: contain;
      }
    }
  </style>

</head>

<body>

  <section class="hero">
    <img
      class="logo"
      src="IMG_5076.png"
      alt="ROAM Co."
    >

    <div class="coming-soon">
      Coming Soon
    </div>
  </section>

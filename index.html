<!DOCTYPE html>
<html lang="en">

<head>

  <!-- Google Analytics -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-RSWZ7DDNLM"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());

  <meta charset="UTF-8">
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>ROAM Co. | Coming Soon</title>

  <style>

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      background: #000;
      color: #fff;
      font-family: Arial, Helvetica, sans-serif;
    }

    body {
      overflow-x: hidden;
    }


    /* =========================
       HEADER
       ========================= */

    .hero {
      width: 100%;
      text-align: center;
      padding: 28px 14px 26px;
    }

    .logo-frame {
      width: 94vw;
      max-width: 620px;
      height: 135px;
      margin: 0 auto;
      position: relative;
      overflow: hidden;
    }

    .logo-frame img {
      position: absolute;
      width: 100%;
      height: auto;

      left: 50%;
      top: 50%;

      transform:
        translate(-50%, -50%)
        scale(1.18);

      display: block;
    }

    .coming-soon {
      margin-top: 16px;

      font-size: 26px;
      line-height: 1;

      font-weight: 700;
      letter-spacing: 7px;

      white-space: nowrap;
      text-transform: uppercase;
    }


    /* =========================
       PRODUCTS
       ========================= */

    .products {
      width: 100%;
      max-width: 900px;

      margin: 0 auto;

      padding:
        18px
        14px
        60px;

      display: flex;
      flex-direction: column;

      gap: 16px;
    }

    .product {
      width: 100%;

      height: 360px;

      overflow: hidden;

      position: relative;

      background: #000;
    }

    .product img {
      position: absolute;

      width: 100%;
      height: 100%;

      left: 0;
      top: 0;

      object-fit: cover;
      object-position: center;

      display: block;
    }


    /* =========================
       DIFFERENT IMAGE CROPS
       ========================= */

    .wide img {
      object-fit: cover;
      transform: scale(1.05);
    }

    .tall img {
      object-fit: cover;
      transform: scale(1.08);
    }

    .tight img {
      object-fit: cover;
      transform: scale(1.15);
    }


    /* =========================
       PHONE
       ========================= */

    @media (max-width: 700px) {

      .hero {
        padding-top: 22px;
        padding-bottom: 20px;
      }

      .logo-frame {
        width: 94vw;
        height: 120px;
      }

      .logo-frame img {
        transform:
          translate(-50%, -50%)
          scale(1.16);
      }

      .coming-soon {
        margin-top: 13px;

        font-size: 25px;
        letter-spacing: 7px;
      }

      .products {
        padding:
          14px
          14px
          50px;

        gap: 14px;
      }

      .product {
        height: 330px;
      }

    }


    /* =========================
       SMALL PHONES
       ========================= */

    @media (max-width: 430px) {

      .logo-frame {
        height: 105px;
      }

      .coming-soon {
        font-size: 23px;
        letter-spacing: 6px;
      }

      .product {
        height: 300px;
      }

    }


    /* =========================
       DESKTOP
       ========================= */

    @media (min-width: 850px) {

      .products {
        display: grid;

        grid-template-columns:
          repeat(2, 1fr);

        gap: 18px;
      }

      .product {
        height: 400px;
      }

    }

  </style>

</head>


<body>


  <!-- =========================
       LOGO
       ========================= -->

  <header class="hero">

    <div class="logo-frame">

    <div class="coming-soon">

    </div>


    <div class="product wide">
      <img
        src="BDDD0CE5-3C6F-4F0D-9A8D-901DD5D689CC.jpeg"

    </div>

  </main>


</body>

</html>

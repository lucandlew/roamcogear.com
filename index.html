<!DOCTYPE html>
<html lang="en">
<head>

  <!-- Google Analytics -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-RSWZ7DDNLM"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());
    gtag('config', 'G-RSWZ7DDNLM');
  </script>

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>ROAM Co. | Coming Soon</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html {
      background: #000;
    }

    body {
      background: #000;
      color: #fff;
      font-family: Arial, Helvetica, sans-serif;
      min-height: 100vh;
    }

    /* TOP SECTION */

    .hero {
      width: 100%;
      min-height: 55vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 70px 20px 55px;
    }

    .logo {
      width: min(500px, 82vw);
      height: auto;
      display: block;
      object-fit: contain;
      margin-bottom: 30px;
    }

    .coming-soon {
      font-size: clamp(24px, 5vw, 44px);
      font-weight: 700;
      letter-spacing: 10px;
      text-transform: uppercase;
    }

    /* PRODUCT GRID */

    .products {
      width: min(1250px, 94%);
      margin: 0 auto;
      padding: 20px 0 100px;

      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 22px;
    }

    .product {
      width: 100%;
      aspect-ratio: 1 / 1;
      background: #080808;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    .product img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      display: block;
    }

    /* TABLET */

    @media (max-width: 900px) {
      .products {
        grid-template-columns: repeat(2, 1fr);
        gap: 14px;
      }

      .hero {
        min-height: 48vh;
      }
    }

    /* PHONE */

    @media (max-width: 520px) {
      .hero {
        min-height: 42vh;
        padding: 50px 15px 40px;
      }

      .logo {
        width: 82vw;
        margin-bottom: 24px;
      }

      .coming-soon {
        font-size: 25px;
        letter-spacing: 7px;
      }

      .products {
        width: 96%;
        grid-template-columns: repeat(2, 1fr);
        gap: 8px;
        padding-bottom: 60px;
      }
    }
  </style>

</head>

<body>

  <!-- ROAM LOGO / COMING SOON -->

  <section class="hero">
    <img
      class="logo"
      src="IMG_5076.png"

       ========================= */

        padding-top: 45px;
      }

        width: min(1150px, 94%);

        display: grid;

        grid-template-columns:
          repeat(2, 1fr);

      }

  <!--
    These two filenames are too long to see completely
    in the GitHub mobile screenshot.

    This automatically finds the files whose names begin
    with B4A56F71 and EBDDD239 and adds them to the page.
  -->

  <script>

    async function addLongFilenameImages() {

      try {

        const response = await fetch(
          'https://api.github.com/repos/lucandlew/roamcogear.com/contents/'
        );

        const files = await response.json();

        const prefixes = [
          'B4A56F71-',
          'EBDDD239-'
        ];

        const products =
          document.getElementById('products');

        prefixes.forEach(prefix => {

          const file = files.find(item =>
            item.type === 'file' &&
            item.name.startsWith(prefix)
          );

          if (file) {

            const product =
              document.createElement('div');

            product.className = 'product';

            const image =
              document.createElement('img');

            image.src = file.name;
            image.alt = 'ROAM Co. product';

            product.appendChild(image);
            products.appendChild(product);

          }

        });

      }

      catch (error) {

        console.log(
          'Could not load additional ROAM images.'
        );

      }

    }

    addLongFilenameImages();

  </script>

</body>
</html>

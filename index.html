  <meta charset="UTF-8">

  <title>ROAM Co. | Coming Soon</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      min-height: 100%;
      background: #000;
      color: #fff;
      font-family: Arial, Helvetica, sans-serif;
    }

    body {
      overflow-x: hidden;
    }

    /* HEADER */

    .hero {
      width: 100%;
      padding: 28px 16px 24px;
      text-align: center;
    }

    .logo-wrap {
      width: min(620px, 90vw);
      margin: 0 auto;
    }

    .logo-wrap img {
      width: 100%;
      height: auto;
      display: block;
    }

    .coming-soon {
      margin-top: 18px;
      font-size: 26px;
      font-weight: 700;
      letter-spacing: 8px;
      line-height: 1;
      text-transform: uppercase;
      white-space: nowrap;
    }

    /* PRODUCTS */

    .products {
      width: min(760px, 100%);
      margin: 0 auto;
      padding: 18px 14px 55px;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .product {
      width: 100%;
      background: #000;
      overflow: hidden;
      border-radius: 2px;
    }

    .product img {
      width: 100%;
      height: auto;
      display: block;
    }

    /* PHONE */

    @media (max-width: 700px) {
      .hero {
        padding: 20px 14px 18px;
      }

      .logo-wrap {
        width: 88vw;
      }

      .coming-soon {
        margin-top: 14px;
        font-size: 24px;
        letter-spacing: 6px;
      }

      .products {
        padding: 12px 12px 45px;
        gap: 10px;
      }
    }

    /* DESKTOP */

    @media (min-width: 850px) {
      .products {
        width: min(1100px, 94%);
        display: grid;
        grid-template-columns: repeat(2, 1fr);
        gap: 16px;
      }
    }
  </style>

</head>

<body>

  <header class="hero">

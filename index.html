<!DOCTYPE html>
<html lang="en">

<head>

  <!-- Google Analytics -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-RSWZ7DDNLM"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());
    gtag('config', 'G-RSWZ7DDNLM');
  </script>

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>ROAM CO | Coming Soon</title>

  <style>

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: #080808;
      color: white;
      font-family: Arial, Helvetica, sans-serif;
      min-height: 100vh;
    }


    /* =========================
       ROAM CO HEADER
       ========================= */

    .hero {
      width: 100%;
      text-align: center;
      padding: 35px 20px 28px;
    }

    .logo {
      display: block;
      width: 100%;
      max-width: 420px;
      height: auto;
      margin: 0 auto;
    }

    .coming-soon {
      margin-top: 4px;

      font-size: 16px;
      font-weight: 500;

      letter-spacing: 8px;

      color: #b9955b;

      text-transform: uppercase;
    }


    /* =========================
       PRODUCTS
       ========================= */

    .products {
      width: 100%;
      max-width: 1200px;

      margin: 0 auto;

      padding: 5px 16px 50px;

      display: grid;

      grid-template-columns: repeat(2, 1fr);

      gap: 15px;
    }

    .product {
      width: 100%;
      overflow: hidden;
    }

    .product img {
      width: 100%;
      height: auto;

      display: block;
    }


    /* =========================
       MOBILE
       ========================= */

    @media (max-width: 700px) {

      .hero {
        padding: 28px 15px 22px;
      }

      .logo {
        max-width: 330px;
      }

      .coming-soon {
        margin-top: 3px;

        font-size: 13px;

        letter-spacing: 6px;
      }

      .products {
        grid-template-columns: 1fr;

        gap: 10px;

        padding: 5px 10px 35px;
      }

    }

  </style>

</head>


<body>


  <!-- =========================
       LOGO + COMING SOON
       ========================= -->

  <header class="hero">

    <img
      class="logo"
      src="IMG_5076.jpeg"
      alt="ROAM CO"
    >

    <div class="coming-soon">
      COMING SOON
    </div>

  </header>



  <!-- =========================
       PRODUCT PREVIEW
       ========================= -->

  <main class="products">


    <!-- CAMO HAT -->

    <div class="product">

      <img
        src="33EEDDEB-FBA2-4636-9580-566C57707885.jpeg"
        alt="ROAM CO Camo Hat"
      >

    </div>



    <!-- BLACK HAT -->

    <div class="product">

      <img
        src="BDDD0CE5-3C6F-4F0D-9A8D-901DD5D689CC.jpeg"
        alt="ROAM CO Black Hat"
      >

    </div>



    <!-- CAMO POLO -->

    <div class="product">

      <img
        src="9236C828-7B5E-4DB8-8E5C-C72C1357CC5C.png"
        alt="ROAM CO Camo Polo"
      >

    </div>


  </main>


</body>

</html>

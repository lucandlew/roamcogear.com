<!DOCTYPE html>
<html lang="en">

<head>

  <!-- Google Analytics -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-RSWZ7DDNLM"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());
    gtag('config', 'G-RSWZ7DDNLM');
  </script>

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>ROAM Co. | Coming Soon</title>

  <style>

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      min-height: 100%;
      background: #000;
      color: #fff;
      font-family: Arial, Helvetica, sans-serif;
    }

    body {
      overflow-x: hidden;
    }


    /* =========================
       HEADER
       ========================= */

    .hero {
      width: 100%;
      text-align: center;
      padding: 42px 16px 28px;
    }

    .logo-crop {
      width: min(700px, 92vw);
      height: 170px;
      margin: 0 auto;
      overflow: hidden;
      position: relative;
    }

    .logo-crop img {
      position: absolute;
      width: 100%;
      height: auto;

      left: 50%;
      top: 50%;

      transform:
        translate(-50%, -50%)
        scale(1.03);

      display: block;
    }

    .coming-soon {
      margin-top: 8px;

      color: #d1a44b;

      font-size: clamp(18px, 4.5vw, 30px);
      font-weight: 400;

      letter-spacing: 12px;
      line-height: 1;

      text-transform: uppercase;
      white-space: nowrap;
    }


    /* =========================
       PRODUCTS
       ========================= */

    .products {
      width: min(900px, 100%);
      margin: 0 auto;

      padding:
        24px
        12px
        60px;

      display: flex;
      flex-direction: column;

      gap: 10px;
    }

    .product {
      width: 100%;
      background: #000;
      overflow: hidden;
    }

    .product img {
      width: 100%;
      height: auto;
      display: block;
    }


    /* =========================
       PHONE
       ========================= */

    @media (max-width: 700px) {

      .hero {
        padding:
          28px
          12px
          22px;
      }

      .logo-crop {
        width: 94vw;
        height: 125px;
      }

      .logo-crop img {
        transform:
          translate(-50%, -50%)
          scale(1.02);
      }

      .coming-soon {
        margin-top: 6px;

        font-size: 18px;
        letter-spacing: 8px;
      }

      .products {
        padding-top: 18px;
        gap: 8px;
      }

    }


    /* =========================
       DESKTOP
       ========================= */

    @media (min-width: 900px) {

      .logo-crop {
        height: 190px;
      }

      .products {
        width: min(1150px, 94%);

        display: grid;
        grid-template-columns: repeat(2, 1fr);

        gap: 16px;
      }

    }

  </style>

</head>


<body>


  <!-- =========================
       ROAM CO LOGO
       ========================= -->

  <header class="hero">

    <div class="logo-crop">

      <img
        src="IMG_5076.png"
        alt="ROAM Co."
      >

    </div>

    <div class="coming-soon">
      Coming Soon
    </div>

  </header>


  <!-- =========================
       PRODUCTS
       ========================= -->

  <main class="products">


    <div class="product">
      <img
        src="IMG_5213.jpeg"
        alt="ROAM Co. product"
      >
    </div>


    <div class="product">
      <img
        src="IMG_5214.jpeg"
        alt="ROAM Co. product"
      >
    </div>


    <div class="product">
      <img
        src="IMG_5215.jpeg"
        alt="ROAM Co. product"
      >
    </div>


    <div class="product">
      <img
        src="068E0137-1D3C-4CD9-BDE9-DC3684E110B1.png"
        alt="ROAM Co. product"
      >
    </div>


    <div class="product">
      <img
        src="33EEDDEB-FBA2-4636-9580-566C57707885.jpeg"
        alt="ROAM Co. product"
      >
    </div>


    <div class="product">
      <img
        src="9236C828-7B5E-4DB8-8E5C-C72C1357CC5C.png"
        alt="ROAM Co. product"
      >
    </div>


    <div class="product">
      <img
        src="BDDD0CE5-3C6F-4F0D-9A8D-901DD5D689CC.jpeg"
        alt="ROAM Co. product"
      >
    </div>


    <div class="product">
      <img
        src="FC47C8C6-7260-4357-B3AB-81639DE1E0C9.png"
        alt="ROAM Co. product"
      >
    </div>


  </main>


</body>

</html>

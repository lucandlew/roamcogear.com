  <script>

  <meta charset="UTF-8">

  <title>ROAM Co. | Coming Soon</title>

  <style>

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      min-height: 100%;
      background: #000;
      color: #fff;
      font-family: Arial, Helvetica, sans-serif;
    }

    body {
      overflow-x: hidden;
    }


    /* =========================
       TOP / LOGO
       ========================= */

    .hero {
      width: 100%;
      padding: 35px 15px 28px;
      text-align: center;
    }

    .logo-window {
      width: min(650px, 94vw);
      height: 145px;
      margin: 0 auto;
      overflow: hidden;
      position: relative;
    }

    .logo {
      position: absolute;

      width: 100%;
      height: auto;

      left: 50%;
      top: 50%;

      transform:
        translate(-50%, -50%)
        scale(1.05);

      display: block;
    }

    .coming-soon {
      margin-top: 20px;

      font-size: clamp(24px, 6vw, 38px);
      font-weight: 700;

      letter-spacing: 8px;
      line-height: 1;

      text-transform: uppercase;
      white-space: nowrap;
    }


    /* =========================
       PRODUCTS
       ========================= */

    .products {
      width: min(1000px, 100%);

      margin: 0 auto;

      padding:
        18px
        12px
        60px;
    }

    .product {
      width: 100%;

      margin-bottom: 14px;

      background: #000;

      display: flex;
      justify-content: center;
      align-items: center;

      overflow: hidden;
    }

    .product img {
      display: block;

      width: 100%;
      height: auto;

      object-fit: contain;
    }


    /* =========================
       DESKTOP
       ========================= */

    @media (min-width: 800px) {

      .hero {
        padding-top: 45px;
      }

      .logo-window {
        width: 600px;
        height: 150px;
      }

      .coming-soon {
        margin-top: 25px;
      }

      .products {
        display: grid;

        grid-template-columns:
          repeat(2, 1fr);

        gap: 18px;

        padding-top: 25px;
      }

      .product {
        margin: 0;
      }

    }


    /* =========================
       PHONE
       ========================= */

    @media (max-width: 799px) {

      .hero {
        padding:
          25px
          10px
          18px;
      }

      .logo-window {
        width: 94vw;
        height: 115px;
      }

      .logo {
        transform:
          translate(-50%, -50%)
          scale(1.08);
      }

      .coming-soon {
        margin-top: 14px;

        font-size: 25px;

        letter-spacing: 7px;
      }

      .products {
        padding:
          14px
          10px
          50px;
      }

      .product {
        margin-bottom: 10px;
      }

    }

  </style>

</head>

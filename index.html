<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>ROAM Co. | Coming Soon</title>

  <meta name="description" content="ROAM Co. — Made to Roam">

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      background: #000;
    }

    body {
      min-height: 100vh;
      overflow: hidden;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .coming-soon {
      width: 100%;
      text-align: center;
      transform: translateY(-300px);
    }

    .logo {
      display: block;
      width: min(90vw, 900px);
      height: auto;
      margin: 0 auto;
    }

    .coming-soon p {
      margin-top: 30px;
      color: #d6aa4c;
      font-family: Arial, sans-serif;
      font-size: clamp(16px, 2.5vw, 26px);
      letter-spacing: 12px;
      padding-left: 12px;
    }
  </style>
</head>

<body>

  <div class="coming-soon">

    <img
      class="logo"
      src="IMG_5076.png"
      alt="ROAM Co."
    >

    <p>COMING SOON</p>

  </div>

</body>
</html>

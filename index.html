  <title>ROAM Co. | Coming Soon</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html,
    body {
      background: #000;
      color: #fff;
      font-family: Arial, Helvetica, sans-serif;
      width: 100%;
    }

    body {
      min-height: 100vh;
      overflow-x: hidden;
    }

    .hero {
      width: 100%;
      text-align: center;
      padding: 34px 16px 20px;
    }

    .logo {
      display: block;
      width: min(540px, 84vw);
      height: auto;
      margin: 0 auto 14px;
    }

    .coming-soon {
      font-size: clamp(24px, 5vw, 38px);
      font-weight: 700;
      letter-spacing: 9px;
      text-transform: uppercase;
      line-height: 1;
    }

    .products {
      width: 100%;
      max-width: 1000px;
      margin: 0 auto;
      padding: 8px 10px 50px;
    }

    .product {
      width: 100%;
      margin: 0 auto 10px;
      overflow: hidden;
      background: #000;
    }

    .product img {
      display: block;
      width: 100%;
      height: auto;
      margin: 0 auto;
    }

    @media (min-width: 700px) {
      .products {
        display: grid;
        grid-template-columns: repeat(2, 1fr);
        gap: 14px;
      }

      .product {
        margin: 0;
      }
    }

    @media (max-width: 699px) {
      .hero {
        padding-top: 24px;
        padding-bottom: 14px;
      }

      .logo {
        width: 86vw;
        margin-bottom: 10px;
      }

      .coming-soon {
        font-size: 25px;
        letter-spacing: 7px;
      }

      .products {
        padding-top: 6px;
      }

      .product {
        margin-bottom: 8px;
      }
    }
  </style>

</head>
